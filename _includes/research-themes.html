<div class="{% if include.cards %}grid research-grid{% else %}feature-list{% endif %}" aria-label="{{ t.research_themes }}">
  {% for theme in site.data.research.themes %}
  <article class="{% if include.cards %}card{% else %}feature{% endif %}">
    <div class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ theme.icon }}</svg></div>
    <div><h{% if include.cards %}2{% else %}3{% endif %} class="feature-title">{{ theme.title | escape }}</h{% if include.cards %}2{% else %}3{% endif %}>
    <p class="feature-text">{{ theme.description[lang] }}</p></div>
  </article>
  {% endfor %}
</div>
