{% if jekyll.environment == 'production' and site.google_analytics != nil and site.google_analytics != '' %}
<!-- Google tag (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ site.google_analytics | jsonify }}, {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
{% endif %}
